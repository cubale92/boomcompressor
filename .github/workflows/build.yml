name: Build Boom-8

# Runs on every push, or by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/Boom8_artefacts/Release/VST3/8cee Boom-8.vst3" dist/
          if [ -d "build/Boom8_artefacts/Release/AU" ]; then cp -R "build/Boom8_artefacts/Release/AU/8cee Boom-8.component" dist/; fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: 8cee-Boom-8-${{ matrix.name }}
          path: dist
